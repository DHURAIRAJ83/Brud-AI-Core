[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brud-ai"
version = "0.1.0"
description = "Multilingual AI system foundation for Tamil, English, and Tanglish"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic-settings>=2.7,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "pytesseract>=0.3.13,<1.0",
  "Pillow>=10.4,<12.0",
  "sentencepiece>=0.2,<0.3",
  "cryptography>=44,<50",
  "torch>=2.13,<3.0",
  "numpy>=2.2,<3.0",
  "llama-cpp-python>=0.3,<0.4",
  "gguf>=0.19,<0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
include = ["backend*", "core_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/database/schema.py" = ["E501"]
"backend/services/import_service.py" = ["E501"]
"backend/services/document_service.py" = ["E501"]
"backend/services/tokenizer_registry.py" = ["E501"]
"backend/services/core_model_service.py" = ["E501"]
"core_model/architecture/*.py" = ["E501"]
"core_model/training/loss.py" = ["E501"]
"core_model/admin_assistant/dashboard_registry.py" = ["E501"]
"core_model/admin_assistant/action_registry.py" = ["E501"]
